[package]
name = "rustcord"
version = "1.0.6"
description = "High-performance Discord desktop client with Equicord support"
authors = ["Rustcord Team"]
license = "MIT"
edition = "2021"

[lib]
name = "rustcord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
tauri-plugin-single-instance = "2"

