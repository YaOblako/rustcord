<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Rustcord Notification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background: transparent !important;
            overflow: hidden !important;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'gg sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            width: 100%;
            height: 100%;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 6px;
        }
        .toast {
            width: 100%;
            background: #111214;
            border-radius: 12px;
            border: none;
            outline: none;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.18s ease;
        }
        .toast:hover {
            background: #18191c;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #2b2d31;
        }
        .content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        .title {
            font-size: 13.5px;
            font-weight: 600;
            color: #f2f3f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.25;
        }
        .title svg {
            flex-shrink: 0;
        }
        .title .you {
            color: #949ba4;
            font-weight: 500;
            font-size: 12.5px;
            margin-left: 2px;
        }
        .close-btn {
            background: transparent;
            border: none;
            outline: none;
            color: #949ba4;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: color 0.12s ease, background 0.12s ease;
        }
        .close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }
        .body-text {
            font-size: 12.5px;
            color: #949ba4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toast" id="toast">
            <img class="avatar" id="avatar" src="logo-no-bg.png" alt="" />
            <div class="content">
                <div class="header-row">
                    <span class="title" id="title"></span>
                    <button class="close-btn" id="closeBtn" title="Закрыть">
                        <svg width="10" height="10" viewBox="0 0 10 10">
                            <polygon fill="currentColor" points="10 0.7 9.3 0 5 4.3 0.7 0 0 0.7 4.3 5 0 9.3 0.7 10 5 5.7 9.3 10 10 9.3 5.7 5"/>
                        </svg>
                    </button>
                </div>
                <div class="body-text" id="bodyText"></div>
            </div>
        </div>
    </div>
    <script>
        const invoke = (cmd, args) => {
            try {
                const t = window.__TAURI_INTERNALS__;
                if (t && t.invoke) return t.invoke(cmd, args || {});
            } catch(e) {}
            return Promise.resolve();
        };

        let currentTarget = null;
        let autoDismissTimer = null;

        function playChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }
                const now = ctx.currentTime;
                const o1 = ctx.createOscillator();
                const g1 = ctx.createGain();
                o1.frequency.setValueAtTime(587.33, now);
                g1.gain.setValueAtTime(0.2, now);
                g1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                o1.connect(g1); g1.connect(ctx.destination);
                o1.start(now); o1.stop(now + 0.12);

                const o2 = ctx.createOscillator();
                const g2 = ctx.createGain();
                o2.frequency.setValueAtTime(880.0, now + 0.08);
                g2.gain.setValueAtTime(0.25, now + 0.08);
                g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
                o2.connect(g2); g2.connect(ctx.destination);
                o2.start(now + 0.08); o2.stop(now + 0.28);
            } catch(e) {}
        }

        window.__RUSTCORD_SHOW_NOTIF__ = function(data) {
            currentTarget = data;
            document.getElementById('title').innerHTML = data.titleHtml || data.title;
            document.getElementById('bodyText').textContent = data.body || '';
            const img = document.getElementById('avatar');
            img.src = data.avatar || 'logo-no-bg.png';
            img.onerror = () => { img.src = 'logo-no-bg.png'; };

            playChime();

            clearTimeout(autoDismissTimer);
            autoDismissTimer = setTimeout(() => {
                invoke('close_notification_window');
            }, 6500);
        };

        document.getElementById('closeBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            clearTimeout(autoDismissTimer);
            invoke('close_notification_window');
        });

        document.getElementById('toast').addEventListener('click', () => {
            clearTimeout(autoDismissTimer);
            invoke('notification_clicked', {
                guildId: currentTarget?.guildId || null,
                channelId: currentTarget?.channelId || null
            });
        });
    </script>
</body>
</html>
